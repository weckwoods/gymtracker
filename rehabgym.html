<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>REHAB LIFT · 12 Wochen</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080a; --panel:#0e1013; --panel2:#14171c; --panel3:#1a1e24;
  --border:#22262e; --border2:#2e333d; --text:#e8eaed; --dim:#8b919c; --dim2:#565c66;
  --neon-a:#c8ff00; --neon-b:#ffaa00; --neon-c:#00e5ff; --neon-r:#ff3d5a; --neon-p:#b96cff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;font-weight:300;min-height:100vh;padding-bottom:96px}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(255,255,255,.012) 2px 4px);pointer-events:none;z-index:0}
body::after{content:'';position:fixed;top:-30%;left:50%;transform:translateX(-50%);width:140%;height:50%;background:radial-gradient(ellipse at center,rgba(200,255,0,.04),transparent 65%);pointer-events:none;z-index:0}

.header{position:sticky;top:0;z-index:100;background:rgba(7,8,10,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:14px 16px 11px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.1em;line-height:1}
.header h1 span{color:var(--neon-a);text-shadow:0 0 12px rgba(200,255,0,.6)}
.header .sub{font-family:'JetBrains Mono',monospace;font-size:8.5px;color:var(--dim2);letter-spacing:.14em;margin-top:4px;text-transform:uppercase}
.hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.block-badge{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--dim);letter-spacing:.14em;border:1px solid var(--border2);padding:2px 7px}
.block-badge.ph2{color:var(--neon-c);border-color:rgba(0,229,255,.4)}
.week-selector{display:flex;align-items:center;gap:5px}
.week-btn{background:var(--panel2);border:1px solid var(--border2);color:var(--dim);width:26px;height:26px;font-size:13px;cursor:pointer;font-family:'JetBrains Mono',monospace}
.week-btn:active{opacity:.5}
.week-label{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--dim);letter-spacing:.1em;min-width:56px;text-align:center}
.week-label .wnum{color:var(--neon-a);font-weight:700;font-size:13px;text-shadow:0 0 10px rgba(200,255,0,.6)}
.week-label .dl{color:var(--neon-b);font-weight:700}

.day-tabs{display:flex;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:60px;z-index:99}
.day-tab{flex:1;padding:12px 6px;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--dim2);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.day-tab.active[data-day="A"]{color:var(--neon-a);border-bottom-color:var(--neon-a);text-shadow:0 0 10px rgba(200,255,0,.5)}
.day-tab.active[data-day="B"]{color:var(--neon-b);border-bottom-color:var(--neon-b);text-shadow:0 0 10px rgba(255,170,0,.5)}
.content{padding:14px 12px;position:relative;z-index:1}
.day-panel{display:none}.day-panel.active{display:block}

.week-overview{background:var(--panel);border:1px solid var(--border);padding:12px;margin-bottom:14px}
.wo-title{font-family:'JetBrains Mono',monospace;font-size:8.5px;color:var(--dim2);letter-spacing:.18em;text-transform:uppercase;margin-bottom:9px}
.wo-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.wo-wk{background:var(--panel2);border:1px solid var(--border);padding:6px 2px;text-align:center}
.wo-wk-num{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--dim2);letter-spacing:.06em}
.wo-wk-focus{font-family:'JetBrains Mono',monospace;font-size:7px;color:var(--dim2);line-height:1.35;margin-top:3px}
.wo-wk.p1{border-color:rgba(255,61,90,.25)}
.wo-wk.p1 .wo-wk-num{color:var(--neon-r)}
.wo-wk.p2{border-color:rgba(0,229,255,.25)}
.wo-wk.p2 .wo-wk-num{color:var(--neon-c)}
.wo-wk.gate{border-color:rgba(185,108,255,.5)}
.wo-wk.gate .wo-wk-num{color:var(--neon-p)}
.wo-wk.deload-wk{border-color:rgba(255,170,0,.4)}
.wo-wk.deload-wk .wo-wk-num{color:var(--neon-b)}
.wo-wk.current{background:var(--panel3);box-shadow:inset 0 0 0 1px var(--neon-a)}
.wo-wk.current .wo-wk-num{color:var(--neon-a);text-shadow:0 0 8px rgba(200,255,0,.7)}

.banner{border:1px solid;border-left-width:3px;padding:11px 13px;margin-bottom:14px;font-family:'JetBrains Mono',monospace;font-size:9.5px;line-height:1.65}
.banner .bt{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:.08em;display:block;margin-bottom:3px}
.banner.gate{border-color:rgba(185,108,255,.45);color:var(--dim);background:rgba(185,108,255,.05)}
.banner.gate .bt{color:var(--neon-p)}
.banner.warn{border-color:rgba(255,61,90,.5);color:var(--dim);background:rgba(255,61,90,.05)}
.banner.warn .bt{color:var(--neon-r)}
.banner.rule{border-color:var(--border2);color:var(--dim2)}
.banner.rule .bt{color:var(--dim)}
.banner b{color:var(--text);font-weight:500}

.blk-label{display:flex;align-items:center;gap:8px;margin:16px 0 8px}
.blk-bar{width:3px;height:13px}
.blk-bar.a{background:var(--neon-a);box-shadow:0 0 8px rgba(200,255,0,.6)}
.blk-bar.b{background:var(--neon-b);box-shadow:0 0 8px rgba(255,170,0,.6)}
.blk-bar.c{background:var(--neon-c);box-shadow:0 0 8px rgba(0,229,255,.6)}
.blk-txt{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--dim);letter-spacing:.18em;text-transform:uppercase}

.ex-card{background:var(--panel);border:1px solid var(--border);margin-bottom:8px;overflow:hidden}
.ex-card.locked{opacity:.42}
.ex-header{padding:13px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;cursor:pointer;user-select:none}
.ex-num{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--dim2);letter-spacing:.15em;margin-bottom:4px}
.ex-name{font-size:14px;font-weight:500;line-height:1.2}
.ex-sub{font-size:10px;color:var(--dim2);font-family:'JetBrains Mono',monospace;margin-top:4px;line-height:1.5}
.ex-header-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.sets-badge{font-family:'JetBrains Mono',monospace;font-size:9px;padding:3px 9px;white-space:nowrap;border:1px solid;background:transparent}
.sets-badge.a{color:var(--neon-a);border-color:rgba(200,255,0,.3)}
.sets-badge.b{color:var(--neon-b);border-color:rgba(255,170,0,.3)}
.sets-badge.c{color:var(--neon-c);border-color:rgba(0,229,255,.3)}
.sets-badge.r{color:var(--neon-r);border-color:rgba(255,61,90,.3)}
.rom-badge{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--neon-r);border:1px solid rgba(255,61,90,.35);padding:2px 7px;white-space:nowrap}
.target-line{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--dim2)}
.target-line .tv{font-weight:700;font-size:11px;letter-spacing:.05em}
.tv.a{color:var(--neon-a);text-shadow:0 0 10px rgba(200,255,0,.7)}
.tv.b{color:var(--neon-b);text-shadow:0 0 10px rgba(255,170,0,.7)}
.tv.c{color:var(--neon-c);text-shadow:0 0 10px rgba(0,229,255,.7)}
.tv.r{color:var(--neon-r);text-shadow:0 0 10px rgba(255,61,90,.7)}
.tv.deload{color:var(--neon-b)!important;text-shadow:0 0 10px rgba(255,170,0,.7)!important}
.chevron{font-size:9px;color:var(--dim2);transition:transform .2s;font-family:'JetBrains Mono',monospace}
.ex-card.open .chevron{transform:rotate(180deg)}

.ex-log{display:none;border-top:1px solid var(--border);padding:13px 14px;background:var(--panel2)}
.ex-card.open .ex-log{display:block}
.log-week-label{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--dim2);letter-spacing:.2em;text-transform:uppercase;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center}
.autosave-dot{width:6px;height:6px;border-radius:50%;background:var(--dim2);transition:all .3s}
.autosave-dot.on{background:var(--neon-a);box-shadow:0 0 8px rgba(200,255,0,.8)}
.sets-grid{display:grid;gap:6px}
.set-row{display:grid;grid-template-columns:42px 1fr 1fr;gap:6px;align-items:center}
.set-num{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--dim2);text-align:center;letter-spacing:.1em;font-weight:700}
.set-row.top-row .set-num.a{color:var(--neon-a);text-shadow:0 0 8px rgba(200,255,0,.6)}
.set-row.top-row .set-num.b{color:var(--neon-b);text-shadow:0 0 8px rgba(255,170,0,.6)}
.set-row.top-row .set-num.c{color:var(--neon-c);text-shadow:0 0 8px rgba(0,229,255,.6)}
.input-labels{display:grid;grid-template-columns:42px 1fr 1fr;gap:6px;margin-bottom:4px}
.input-label{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--dim2);text-align:center;text-transform:uppercase;letter-spacing:.12em}
.set-input{background:var(--bg);border:1px solid var(--border2);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:14px;padding:8px 6px;text-align:center;width:100%;outline:none;-webkit-appearance:none;appearance:none}
.set-input:focus{border-color:var(--neon-a);box-shadow:0 0 10px rgba(200,255,0,.2)}
.rom-row{display:grid;grid-template-columns:42px 1fr;gap:6px;align-items:center;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border2)}
.rom-row .set-num{color:var(--neon-r)}
.prev-log{margin-top:11px;padding-top:9px;border-top:1px solid var(--border)}
.prev-log-title{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--dim2);letter-spacing:.18em;text-transform:uppercase;margin-bottom:6px}
.prev-entry{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--dim2);padding:3px 0}
.prev-entry .pw{color:var(--dim)}

.session-card{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--neon-r);padding:13px 14px;margin-top:16px}
.session-title{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:.08em;color:var(--neon-r);margin-bottom:3px}
.session-sub{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--dim2);line-height:1.6;margin-bottom:11px}
.sess-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sess-f label{display:block;font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--dim2);letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
.sess-f input,.sess-note textarea{width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:14px;padding:8px 6px;text-align:center;outline:none;-webkit-appearance:none;appearance:none}
.sess-note{margin-top:8px}
.sess-note textarea{font-family:'Space Grotesk',sans-serif;font-size:13px;text-align:left;min-height:58px;resize:vertical}
.sess-f input:focus,.sess-note textarea:focus{border-color:var(--neon-r);box-shadow:0 0 10px rgba(255,61,90,.2)}
.flag24{margin-top:10px;font-family:'JetBrains Mono',monospace;font-size:9px;padding:8px 10px;border:1px solid var(--border2);color:var(--dim2);line-height:1.6}
.flag24.bad{border-color:rgba(255,61,90,.5);color:var(--neon-r)}
.flag24.ok{border-color:rgba(200,255,0,.35);color:var(--neon-a)}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(7,8,10,.96);border-top:1px solid var(--border);display:flex;padding:8px 12px 22px;gap:6px;z-index:100;backdrop-filter:blur(14px)}
.nav-btn{flex:1;padding:10px 4px;background:var(--panel2);border:1px solid var(--border2);color:var(--dim);font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.nav-btn.hi{border-color:rgba(185,108,255,.4);color:var(--neon-p)}
.nav-btn:active{opacity:.6}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-8px);background:var(--panel3);border:1px solid var(--neon-a);color:var(--neon-a);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;padding:7px 14px;opacity:0;pointer-events:none;transition:all .2s;z-index:200;white-space:nowrap;box-shadow:0 0 20px rgba(200,255,0,.15)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:300;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--border2);border-bottom:none;padding:24px 20px 36px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto}
.modal h3{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.08em;margin-bottom:6px;color:var(--neon-p)}
.modal-sub{font-size:11px;color:var(--dim);font-family:'JetBrains Mono',monospace;line-height:1.7;margin-bottom:18px}
.crit-row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--border)}
.crit-row:first-of-type{border-top:none}
.crit-row input{appearance:none;-webkit-appearance:none;width:19px;height:19px;flex:0 0 19px;border:1.5px solid var(--dim2);background:transparent;position:relative;cursor:pointer;margin-top:1px}
.crit-row input:checked{background:var(--neon-p);border-color:var(--neon-p)}
.crit-row input:checked::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(43deg)}
.crit-row span{font-size:12.5px;color:var(--text);line-height:1.4}
.modal-btn{width:100%;padding:13px;background:var(--panel2);border:1px solid var(--border2);color:var(--dim);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;margin-top:9px}
.modal-btn.go{border-color:var(--neon-p);color:var(--neon-p)}
.modal-btn.warnb{border-color:rgba(255,61,90,.5);color:var(--neon-r)}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>REHAB<span>_</span>LIFT</h1>
    <div class="sub">Niklas · 12 Wochen · Knie</div>
  </div>
  <div class="hdr-right">
    <div class="block-badge" id="phase-badge">PHASE 1</div>
    <div class="week-selector">
      <button class="week-btn" onclick="changeWeek(-1)">‹</button>
      <div class="week-label" id="wk-label">WK <span class="wnum">1</span></div>
      <button class="week-btn" onclick="changeWeek(1)">›</button>
    </div>
  </div>
</div>

<div class="day-tabs">
  <button class="day-tab active" data-day="A" onclick="switchDay('A')">TAG A · QUAD</button>
  <button class="day-tab" data-day="B" onclick="switchDay('B')">TAG B · HÜFTE</button>
</div>

<div class="content">
  <div class="week-overview">
    <div class="wo-title">12-Wochen Reha-Block</div>
    <div class="wo-grid" id="wo-grid"></div>
  </div>

  <div id="banner-zone"></div>

  <div class="day-panel active" id="panel-A"></div>
  <div class="day-panel" id="panel-B"></div>
</div>

<div class="bottom-nav">
  <button class="nav-btn hi" onclick="openGate()">Freigabe</button>
  <button class="nav-btn" onclick="exportMd()">Bericht</button>
  <button class="nav-btn" onclick="exportData()">Export</button>
  <button class="nav-btn" onclick="importTrigger()">Import</button>
</div>
<input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="importData(event)">

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modal-gate">
  <div class="modal">
    <h3>FREIGABE PHASE 2</h3>
    <div class="modal-sub">Alle fünf Kriterien müssen erfüllt sein. Das Kalenderdatum ist irrelevant — ohne Freigabe bleibt Phase 1 aktiv, auch ab Woche 5.</div>
    <div id="crit-list"></div>
    <button class="modal-btn go" onclick="closeModals()">Übernehmen</button>
    <button class="modal-btn warnb" onclick="resetAll()">Alle Daten löschen</button>
  </div>
</div>

<script>
"use strict";

/* ═══════════════════════════════════════════════════════════
   ÜBUNGEN
   Beine wechseln mit der Phase. Arme laufen durchgehend.
   ═══════════════════════════════════════════════════════════ */

const LEGS = {
  1:{
    A:[
      {id:'A1a',num:'01',name:'BFR Beinstrecker',sub:'30-15-15-15 · 20–30 % 1RM · 30 s Pause · Endanschlag setzen',sets:4,reps:'30-15-15-15',color:'a',bfr:true,rom:true,romHint:'90–60°'},
      {id:'A2a',num:'02',name:'Abduktoren-Maschine',sub:'Rumpf aufrecht · kein Ausweichen über den Oberkörper',sets:3,reps:'3 × 20',color:'a'},
      {id:'A3a',num:'03',name:'Adduktoren-Maschine',sub:'Medialer Zugvektor',sets:3,reps:'3 × 20',color:'a'},
      {id:'A4a',num:'04',name:'Wadenheben stehend',sub:'Knie fast gestreckt · voller ROM',sets:3,reps:'3 × 15',color:'a'}
    ],
    B:[
      {id:'B1a',num:'01',name:'BFR Beinpresse',sub:'30-15-15-15 · 20–30 % 1RM · Schlitten-Anschlag setzen',sets:4,reps:'30-15-15-15',color:'b',bfr:true,rom:true,romHint:'0–40°'},
      {id:'B2a',num:'02',name:'Glute Kickback am Kabel',sub:'Standbein fixiert · rein aus der Hüfte · kein Hohlkreuz',sets:3,reps:'3 × 15/S',color:'b'},
      {id:'B3a',num:'03',name:'Beinbeuger liegend',sub:'Leicht · Sehnenqualität, nicht Maximalkraft',sets:3,reps:'3 × 20',color:'b'},
      {id:'B4a',num:'04',name:'Wadenheben sitzend',sub:'Voller ROM · Pause unten',sets:3,reps:'3 × 15',color:'b'}
    ]
  },
  2:{
    A:[
      {id:'A1b',num:'01',name:'Beinpresse, Füße hoch & breit',sub:'Tempo 3-0-1 · RPE 7–8 · ROM alle 2 Wochen +5° wenn schmerzfrei',sets:4,reps:'4 × 15–20',color:'a',rom:true,romHint:'ab 0–40°'},
      {id:'A2b',num:'02',name:'Beinstrecker',sub:'Endanschlag begrenzen · niemals in die Impaktzone',sets:3,reps:'3 × 15–20',color:'a',rom:true,romHint:'ab 90–60°'},
      {id:'A3b',num:'03',name:'Split Squat statisch',sub:'Schienbein senkrecht · Knie hinter den Zehen · Tiefe begrenzt',sets:3,reps:'3 × 12/S',color:'a',rom:true,romHint:'Tiefe in °'},
      {id:'A4b',num:'04',name:'Adduktoren-Maschine',sub:'Medialer Zugvektor',sets:3,reps:'3 × 15–20',color:'a'}
    ],
    B:[
      {id:'B1b',num:'01',name:'45°-Rückenstrecker, Glute-Bias',sub:'Oberer Rücken rund · Füße auswärts · Ende neutral, keine Hyperextension',sets:4,reps:'4 × 12–15',color:'b'},
      {id:'B2b',num:'02',name:'Rumänisches Kreuzheben, leicht',sub:'~50 % Altgewicht · Knie fixiert · NIE in Dehnschmerz (Hamstring-Sehne)',sets:3,reps:'3 × 12',color:'b'},
      {id:'B3b',num:'03',name:'Beinbeuger sitzend',sub:'Hohe Wdh., niedrige Last',sets:3,reps:'3 × 15–20',color:'b'},
      {id:'B4b',num:'04',name:'Cable Hip Abduction',sub:'Rumpf aufrecht · kein Ausweichen · alt.: Abduktoren-Maschine',sets:3,reps:'3 × 15–20',color:'b'}
    ]
  }
};

/* Arme — unverändert aus dem Lift Tracker übernommen */
const ARMS = {
  A:[
    {id:'A5',num:'05',name:'Trizeps-Pushdown',sub:'1 Warmup · Top all-out · Backoff –12 %',sets:2,reps:'Top 8–10',color:'c'},
    {id:'A6',num:'06',name:'Single-Arm Overhead Extension (Kabel)',sub:'1 Warmup · langer Kopf in Dehnung · bei Ulnaris-Zwicken sofort raus',sets:2,reps:'Top 10–12/S',color:'c'},
    {id:'A7',num:'07',name:'Kabel-Seitheben (einseitig)',sub:'1 Warmup · Top all-out · Backoff –10 %',sets:2,reps:'Top 12–15',color:'c'}
  ],
  B:[
    {id:'B5',num:'05',name:'EZ-Bar Curl',sub:'1 Warmup · Top all-out · Backoff –12 %',sets:2,reps:'Top 6–8',color:'c'},
    {id:'B6',num:'06',name:'Incline Dumbbell Curl',sub:'1 Warmup · 45° · Stretch-Mediated · Top all-out',sets:2,reps:'Top 6–8',color:'c'},
    {id:'B7',num:'07',name:'Landmine Press (einseitig)',sub:'1 Warmup · frontale Schulter · Top all-out',sets:2,reps:'Top 8–10/S',color:'c'}
  ]
};

/* ═══ 12-Wochen-Modell ═══
   Phase 1: keine Lastprogression — BFR, ROM fix.
   Phase 2: Last und ROM alternieren. Nie beide in derselben Woche (R5). */
const WEEKS=[
  {w:1, ph:1, mode:'fix',    label:'Start\nROM fix'},
  {w:2, ph:1, mode:'fix',    label:'BFR\nStart'},
  {w:3, ph:1, mode:'reps',   label:'Wdh\n+'},
  {w:4, ph:1, mode:'reps',   label:'Wdh\n+'},
  {w:5, ph:2, mode:'base',   label:'Gate\nBaseline'},
  {w:6, ph:2, mode:'load',   label:'Last\n+2.5%'},
  {w:7, ph:2, mode:'rom',    label:'ROM\n+5°'},
  {w:8, ph:2, mode:'load',   label:'Last\n+2.5%'},
  {w:9, ph:2, mode:'rom',    label:'ROM\n+5°'},
  {w:10,ph:2, mode:'load',   label:'Last\n+2.5%'},
  {w:11,ph:2, mode:'rom',    label:'ROM\n+5°'},
  {w:12,ph:2, mode:'deload', label:'Deload\nRe-Test'}
];
const TOTAL_WEEKS=12;

const CRITERIA=[
  'Einbeinige Kniebeuge bis 45° schmerzfrei (≤ 2/10)',
  'Treppe abwärts schmerzfrei',
  'Kein Nachschmerz > 24 h nach der intensivsten Radeinheit',
  'Einbeinstand mit geschlossenen Augen 30 s stabil, Becken waagrecht',
  'Kein Erguss- oder Spannungsgefühl morgens'
];

/* ═══ State ═══ */
let currentWeek=1, currentDay='A', gate=CRITERIA.map(()=>false);
const timers={};
const P='rhb_';
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function dKey(w,id){return P+'w'+w+'_'+id}
function sKey(w,d){return P+'sess_w'+w+'_'+d}

function gateOpen(){return gate.every(Boolean)}
function phaseFor(w){const def=WEEKS[w-1].ph;return (def===2&&!gateOpen())?1:def;}
function modeFor(w){return phaseFor(w)===1?(WEEKS[w-1].ph===2?'hold':WEEKS[w-1].mode):WEEKS[w-1].mode;}
function exFor(day){return LEGS[phaseFor(currentWeek)][day].concat(ARMS[day]);}
function allIds(){const s=[];[1,2].forEach(p=>['A','B'].forEach(d=>LEGS[p][d].forEach(e=>s.push(e))));
  ['A','B'].forEach(d=>ARMS[d].forEach(e=>s.push(e)));return s;}
function exById(id){return allIds().find(e=>e.id===id);}
function round25(v){return Math.round(v/2.5)*2.5}

/* ═══ Init ═══ */
window.addEventListener('DOMContentLoaded',()=>{
  currentWeek=parseInt(lsGet(P+'week')||'1');
  const g=lsGet(P+'gate'); if(g){try{const a=JSON.parse(g);if(a.length===5)gate=a;}catch(e){}}
  buildCrit(); refreshAll();
});

/* ═══ Render ═══ */
function refreshAll(){ updateHeader(); buildOverview(); buildBanners(); buildDay('A'); buildDay('B'); }

function updateHeader(){
  const ph=phaseFor(currentWeek);
  const b=document.getElementById('phase-badge');
  b.textContent='PHASE '+ph; b.className='block-badge'+(ph===2?' ph2':'');
  const dl=WEEKS[currentWeek-1].mode==='deload'&&ph===2;
  document.getElementById('wk-label').innerHTML='WK <span class="wnum">'+currentWeek+'</span>'+(dl?' <span class="dl">DL</span>':'');
}

function buildOverview(){
  const g=document.getElementById('wo-grid'); g.innerHTML='';
  WEEKS.forEach(wk=>{
    const ph=phaseFor(wk.w);
    let cls='wo-wk '+(ph===1?'p1':'p2');
    if(wk.w===5)cls+=' gate';
    if(wk.mode==='deload')cls+=' deload-wk';
    if(wk.w===currentWeek)cls+=' current';
    const lbl=(ph===1&&wk.ph===2)?'Phase 1\nhalten':wk.label;
    const d=document.createElement('div'); d.className=cls;
    d.innerHTML='<div class="wo-wk-num">W'+wk.w+'</div><div class="wo-wk-focus">'+lbl.replace('\n','<br>')+'</div>';
    g.appendChild(d);
  });
}

function buildBanners(){
  const z=document.getElementById('banner-zone'); z.innerHTML='';
  const wk=WEEKS[currentWeek-1], ph=phaseFor(currentWeek);
  if(wk.ph===2&&ph===1){
    z.innerHTML+='<div class="banner warn"><span class="bt">Freigabe fehlt</span>Woche '+currentWeek+' wäre Phase 2 — aber '+gate.filter(Boolean).length+' von 5 Kriterien sind erfüllt. Das Programm bleibt auf <b>Phase 1</b>. Kriterien schlagen Kalender.</div>';
  }
  if(currentWeek===5&&ph===2){
    z.innerHTML+='<div class="banner gate"><span class="bt">Baseline-Woche</span>Arbeitsgewichte neu finden. Bewusst konservativ starten — die Progression beginnt erst in W6. ROM auf Startwert festnageln: geschlossene Kette 0–40°, offene Kette 90–60°.</div>';
  }
  const m=modeFor(currentWeek);
  const txt={
    fix:'Keine Lastprogression. BFR läuft bei 20–30 % 1RM, ROM bleibt fix. Progrediert wird in dieser Phase gar nicht — es geht um Gewebetoleranz.',
    reps:'Progression ausschließlich über <b>Wiederholungen</b>. Last und ROM bleiben unverändert.',
    hold:'Phase 1 wird gehalten. Keine Progression, bis die Freigabe steht.',
    base:'',
    load:'Diese Woche progrediert <b>nur die Last</b>: +2.5 % auf den TOP-Satz der Vorwoche. ROM bleibt exakt gleich.',
    rom:'Diese Woche progrediert <b>nur der ROM</b>: +5° gegenüber der Vorwoche, wenn die letzten zwei Einheiten schmerzfrei waren. Die Last bleibt exakt gleich.',
    deload:'Deload auf 80 % und Re-Test aller drei Messgrößen. Danach entscheidet sich, ob Block 2 startet.'
  }[m];
  if(txt) z.innerHTML+='<div class="banner rule"><span class="bt">Woche '+currentWeek+'</span>'+txt+'</div>';
  z.innerHTML+='<div class="banner rule"><span class="bt">R1 · Winkelregel</span>Belastete Wiederholungen nie in <b>30–60°</b> Flexion. Geschlossene Kette <b>0–40°</b>, offene Kette <b>90–60°</b>. Kein Muskelversagen bei knielastigen Übungen — 2–3 Wdh. in Reserve.</div>';
}

function buildDay(day){
  const panel=document.getElementById('panel-'+day);
  const legs=LEGS[phaseFor(currentWeek)][day], arms=ARMS[day];
  const legTitle=day==='A'?'Beine · Quadrizeps-dominant':'Beine · Hüfte / posterior';
  const armTitle=day==='A'?'Trizeps & Schulter (seitlich)':'Bizeps & Schulter (frontal)';
  let h='<div class="blk-label"><div class="blk-bar '+(day==='A'?'a':'b')+'"></div><span class="blk-txt">'+legTitle+'</span></div>';
  legs.forEach(e=>h+=card(e));
  h+='<div class="blk-label"><div class="blk-bar c"></div><span class="blk-txt">'+armTitle+'</span></div>';
  arms.forEach(e=>h+=card(e));
  h+=sessionCard(day);
  panel.innerHTML=h;
  legs.concat(arms).forEach(e=>{renderSets(e);renderTarget(e);renderPrev(e);});
  renderSession(day);
}

function card(ex){
  const romBadge=ex.rom?'<div class="rom-badge">ROM '+ex.romHint+'</div>':'';
  return '<div class="ex-card" id="card-'+ex.id+'">'+
    '<div class="ex-header" onclick="toggleCard(\''+ex.id+'\')">'+
      '<div><div class="ex-num">'+ex.num+'</div><div class="ex-name">'+ex.name+'</div><div class="ex-sub">'+ex.sub+'</div></div>'+
      '<div class="ex-header-right"><div class="sets-badge '+ex.color+'">'+ex.reps+'</div>'+romBadge+
      '<div class="target-line" id="tgt-'+ex.id+'">SOLL <span class="tv '+ex.color+'">–</span></div>'+
      '<div class="chevron">▼</div></div></div>'+
    '<div class="ex-log"><div class="log-week-label"><span>Woche '+currentWeek+'</span><span class="autosave-dot" id="dot-'+ex.id+'"></span></div>'+
      '<div class="input-labels"><div class="input-label"></div><div class="input-label">kg</div><div class="input-label">wdh</div></div>'+
      '<div class="sets-grid" id="sets-'+ex.id+'"></div>'+
      (ex.rom?'<div class="rom-row"><div class="set-num">ROM</div><input class="set-input" type="number" inputmode="numeric" placeholder="Grad" id="rom-'+ex.id+'" oninput="sched(\''+ex.id+'\')"></div>':'')+
      '<div class="prev-log" id="prev-'+ex.id+'"></div>'+
    '</div></div>';
}

function sessionCard(day){
  return '<div class="session-card">'+
    '<div class="session-title">Einheit '+day+' · Auswertung</div>'+
    '<div class="session-sub">Der Morgenwert am Folgetag ist die eigentliche Auswertungsgröße. Der Schmerz während der Einheit allein sagt wenig.</div>'+
    '<div class="sess-grid">'+
      '<div class="sess-f"><label>Schmerz während</label><input type="number" min="0" max="10" inputmode="numeric" id="sp-'+day+'" oninput="schedSess(\''+day+'\')"></div>'+
      '<div class="sess-f"><label>Morgen danach</label><input type="number" min="0" max="10" inputmode="numeric" id="mp-'+day+'" oninput="schedSess(\''+day+'\')"></div>'+
    '</div>'+
    '<div class="sess-note"><textarea id="nt-'+day+'" placeholder="Auffälligkeiten, Ausweichbewegungen, Gerätespezifisches…" oninput="schedSess(\''+day+'\')"></textarea></div>'+
    '<div class="flag24" id="flag-'+day+'">24-Stunden-Regel: beide Werte eintragen.</div>'+
  '</div>';
}

function renderSets(ex){
  const c=document.getElementById('sets-'+ex.id); if(!c)return;
  const saved=load(currentWeek,ex.id); c.innerHTML='';
  for(let i=1;i<=ex.sets;i++){
    const sd=saved[i]||{}, isTop=(ex.sets===2&&i===1);
    let lab;
    if(ex.bfr) lab=['30','15','15','15'][i-1];
    else if(ex.sets===2) lab=(i===1?'TOP':'BO');
    else lab='S'+i;
    c.innerHTML+='<div class="set-row'+(isTop?' top-row':'')+'">'+
      '<div class="set-num '+ex.color+'">'+lab+'</div>'+
      '<input class="set-input" type="number" inputmode="decimal" placeholder="kg" id="kg-'+ex.id+'-'+i+'" value="'+(sd.kg||'')+'" oninput="sched(\''+ex.id+'\')">'+
      '<input class="set-input" type="number" inputmode="numeric" placeholder="reps" id="rp-'+ex.id+'-'+i+'" value="'+(sd.reps||'')+'" oninput="sched(\''+ex.id+'\')">'+
    '</div>';
  }
  const r=document.getElementById('rom-'+ex.id);
  if(r) r.value=saved.rom||'';
}

function renderTarget(ex){
  const el=document.getElementById('tgt-'+ex.id); if(!el)return;
  const set=(v,c)=>{el.innerHTML='SOLL <span class="tv '+(c||ex.color)+'">'+v+'</span>';};
  const mode=modeFor(currentWeek);
  const isArm=ex.id.length===2;

  if(ex.bfr){ set('20–30 %','r'); return; }
  if(!isArm && (mode==='fix'||mode==='reps'||mode==='hold')){ set(mode==='reps'?'Wdh +':'Last fix'); return; }
  if(mode==='base' && !isArm){ set('Baseline'); return; }

  const prev=load(currentWeek-1,ex.id);
  const top=parseFloat(prev[1]&&prev[1].kg);
  if(currentWeek===1||isNaN(top)||top<=0){ set('– VW fehlt','c'); return; }

  if(mode==='deload'){ set(round25(top*0.8)+' kg','deload'); return; }
  if(mode==='rom'&&!isArm){
    const pr=parseFloat(prev.rom);
    set(round25(top)+' kg'+(isFinite(pr)?' · '+(pr+5)+'°':''),'r');
    return;
  }
  set(round25(top*1.025)+' kg');
}

function renderPrev(ex){
  const c=document.getElementById('prev-'+ex.id); if(!c)return;
  let rows=[];
  for(let w=1;w<=TOTAL_WEEKS;w++){
    if(w===currentWeek)continue;
    const s=load(w,ex.id); if(!Object.keys(s).length)continue;
    let sum=[];
    for(let i=1;i<=ex.sets;i++){const x=s[i]||{};if(x.reps)sum.push(x.kg?(x.kg+'×'+x.reps):x.reps);}
    if(s.rom)sum.push(s.rom+'°');
    if(!sum.length)continue;
    rows.push('<div class="prev-entry"><span>W'+w+'</span><span class="pw">'+sum.join(' · ')+'</span></div>');
  }
  c.innerHTML=rows.length?('<div class="prev-log-title">Verlauf · 12-Wochen-Block</div>'+rows.join('')):'';
}

function renderSession(day){
  const raw=lsGet(sKey(currentWeek,day)); const d=raw?JSON.parse(raw):{};
  const sp=document.getElementById('sp-'+day), mp=document.getElementById('mp-'+day), nt=document.getElementById('nt-'+day);
  if(sp)sp.value=d.sp||''; if(mp)mp.value=d.mp||''; if(nt)nt.value=d.nt||'';
  flag24(day);
}
function flag24(day){
  const el=document.getElementById('flag-'+day); if(!el)return;
  const raw=lsGet(sKey(currentWeek,day)); const d=raw?JSON.parse(raw):{};
  const s=parseFloat(d.sp), m=parseFloat(d.mp);
  const prevRaw=lsGet(sKey(currentWeek-1,day)); const pd=prevRaw?JSON.parse(prevRaw):{};
  const pm=parseFloat(pd.mp);
  if(isNaN(s)||isNaN(m)){el.className='flag24';el.textContent='24-Stunden-Regel: beide Werte eintragen.';return;}
  const worse=isFinite(pm)&&m>pm;
  if(s>3||worse){
    el.className='flag24 bad';
    el.textContent='Verstoß: '+(s>3?'Belastungsschmerz '+s+'/10 über der Grenze von 3. ':'')+(worse?'Morgenwert schlechter als in der Vorwoche. ':'')+'Letzte Progression zurücknehmen — ROM oder Last, nicht die Übung streichen.';
  }else{
    el.className='flag24 ok';
    el.textContent='Innerhalb der Grenzen. Progression in der Folgewoche zulässig.';
  }
}

/* ═══ Speichern ═══ */
function sched(id){clearTimeout(timers[id]);timers[id]=setTimeout(()=>doSave(id),550);}
function doSave(id){
  const ex=exById(id); if(!ex)return;
  const data={};
  for(let i=1;i<=ex.sets;i++){
    data[i]={kg:(document.getElementById('kg-'+id+'-'+i)||{}).value||'',
             reps:(document.getElementById('rp-'+id+'-'+i)||{}).value||''};
  }
  const r=document.getElementById('rom-'+id); if(r&&r.value)data.rom=r.value;
  lsSet(dKey(currentWeek,id),JSON.stringify(data));
  renderTarget(ex); renderPrev(ex);
  const dot=document.getElementById('dot-'+id);
  if(dot){dot.classList.add('on');setTimeout(()=>dot.classList.remove('on'),1100);}
}
function schedSess(day){clearTimeout(timers['s'+day]);timers['s'+day]=setTimeout(()=>{
  lsSet(sKey(currentWeek,day),JSON.stringify({
    sp:(document.getElementById('sp-'+day)||{}).value||'',
    mp:(document.getElementById('mp-'+day)||{}).value||'',
    nt:(document.getElementById('nt-'+day)||{}).value||''}));
  flag24(day);
},550);}
function load(w,id){const r=lsGet(dKey(w,id));return r?JSON.parse(r):{};}

/* ═══ Navigation ═══ */
function changeWeek(d){
  const n=currentWeek+d; if(n<1||n>TOTAL_WEEKS)return;
  currentWeek=n; lsSet(P+'week',n); refreshAll();
  toast('WOCHE '+n+' · PHASE '+phaseFor(n));
}
function switchDay(d){
  currentDay=d;
  document.querySelectorAll('.day-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.day-panel').forEach(p=>p.classList.remove('active'));
  document.querySelector('[data-day="'+d+'"]').classList.add('active');
  document.getElementById('panel-'+d).classList.add('active');
}
function toggleCard(id){const c=document.getElementById('card-'+id);if(c)c.classList.toggle('open');}

/* ═══ Freigabe ═══ */
function buildCrit(){
  const c=document.getElementById('crit-list'); c.innerHTML='';
  CRITERIA.forEach((t,i)=>{
    const row=document.createElement('div'); row.className='crit-row';
    row.innerHTML='<input type="checkbox"'+(gate[i]?' checked':'')+'><span>'+t+'</span>';
    row.querySelector('input').addEventListener('change',e=>{
      gate[i]=e.target.checked; lsSet(P+'gate',JSON.stringify(gate)); refreshAll();
    });
    c.appendChild(row);
  });
}
function openGate(){document.getElementById('modal-gate').classList.add('show');}
function closeModals(){document.querySelectorAll('.modal-overlay').forEach(m=>m.classList.remove('show'));}
function resetAll(){
  if(!confirm('Alle Trainingsdaten dieses Trackers löschen? Nicht rückgängig zu machen.'))return;
  const del=[]; for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(P))del.push(k);}
  del.forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});
  currentWeek=1; gate=CRITERIA.map(()=>false);
  buildCrit(); closeModals(); refreshAll(); toast('ZURÜCKGESETZT');
}

/* ═══ Export ═══ */
function exportData(){
  const d={}; for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(P))d[k]=lsGet(k);}
  dl('rehabgym_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(d,null,2),'application/json');
  toast('EXPORT GESPEICHERT');
}
function exportMd(){
  let m='# Reha-Gym Bericht — 12-Wochen-Block\n\n**Export:** '+new Date().toLocaleDateString('de-DE');
  m+=' · **Aktuell:** Woche '+currentWeek+', Phase '+phaseFor(currentWeek)+'\n\n## Freigabe Phase 2\n\n';
  CRITERIA.forEach((c,i)=>{m+='- ['+(gate[i]?'x':' ')+'] '+c+'\n';});
  ['A','B'].forEach(day=>{
    m+='\n## Tag '+day+'\n';
    [1,2].forEach(ph=>{
      const list=LEGS[ph][day];
      let any=false;
      let t='\n### Beine · Phase '+ph+'\n\n| Übung | Woche | Sätze | ROM |\n|---|---|---|---|\n';
      list.forEach(ex=>{
        for(let w=1;w<=TOTAL_WEEKS;w++){
          const s=load(w,ex.id); if(!Object.keys(s).length)continue;
          let sum=[]; for(let i=1;i<=ex.sets;i++){const x=s[i]||{};if(x.reps)sum.push((x.kg||'BW')+'×'+x.reps);}
          if(!sum.length&&!s.rom)continue;
          any=true; t+='| '+ex.name+' | W'+w+' | '+(sum.join(' · ')||'—')+' | '+(s.rom?s.rom+'°':'—')+' |\n';
        }
      });
      if(any)m+=t;
    });
    let at='\n### Arme\n\n| Übung | Woche | Sätze |\n|---|---|---|\n', anyA=false;
    ARMS[day].forEach(ex=>{
      for(let w=1;w<=TOTAL_WEEKS;w++){
        const s=load(w,ex.id); if(!Object.keys(s).length)continue;
        let sum=[]; for(let i=1;i<=ex.sets;i++){const x=s[i]||{};if(x.reps)sum.push((x.kg||'BW')+'×'+x.reps);}
        if(!sum.length)continue; anyA=true;
        at+='| '+ex.name+' | W'+w+' | '+sum.join(' · ')+' |\n';
      }
    });
    if(anyA)m+=at;
    let st='\n### Schmerzprotokoll Tag '+day+'\n\n| Woche | Während | Morgen danach | Notiz |\n|---|---|---|---|\n', anyS=false;
    for(let w=1;w<=TOTAL_WEEKS;w++){
      const raw=lsGet(sKey(w,day)); if(!raw)continue; const d=JSON.parse(raw);
      if(!d.sp&&!d.mp&&!d.nt)continue; anyS=true;
      st+='| W'+w+' | '+(d.sp||'–')+' | '+(d.mp||'–')+' | '+(d.nt||'—').replace(/\|/g,'/')+' |\n';
    }
    if(anyS)m+=st;
  });
  m+='\n---\n*Bitte prüfen: ROM-Progression vs. Lastprogression (nie beide in derselben Woche), 24-h-Regel-Verstöße, Seitendifferenzen.*\n';
  dl('rehabgym-bericht-'+new Date().toISOString().slice(0,10)+'.md',m,'text/markdown');
  toast('BERICHT GESPEICHERT');
}
function dl(n,t,ty){const b=new Blob([t],{type:ty}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},400);}
function importTrigger(){document.getElementById('importFile').click();}
function importData(e){
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{try{const d=JSON.parse(ev.target.result);
    Object.keys(d).forEach(k=>{if(k.startsWith(P))lsSet(k,d[k]);});
    currentWeek=parseInt(lsGet(P+'week')||'1');
    const g=lsGet(P+'gate'); if(g){const a=JSON.parse(g);if(a.length===5)gate=a;}
    buildCrit(); refreshAll(); toast('IMPORT ERFOLGREICH');
  }catch(err){toast('FEHLER BEIM IMPORT')} e.target.value='';};
  r.readAsText(f);
}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700);}
</script>
