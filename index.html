<style>
/* Layout: one narrow column, sticky plate-coded header (Woche + Tag), slots as hairline-separated rows with round set buttons */
:root{
  --bg:#eceff2; --surface:#ffffff; --ink:#15181c; --muted:#5c6570; --line:#d3d8de; --soft:#e2e6ea;
  --plate-a:#c8321f; --on-a:#ffffff;
  --plate-b:#1d5cbd; --on-b:#ffffff;
  --plate-c:#e0ad00; --on-c:#15181c;
  --plate-d:#2f8a4a; --on-d:#ffffff;
  --display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101215; --surface:#181b1f; --ink:#eceef1; --muted:#98a1ab; --line:#2a2f35; --soft:#22262b;
  --plate-a:#e3533e; --on-a:#ffffff; --plate-b:#4a8bf0; --on-b:#0d1117;
  --plate-c:#f0c42e; --on-c:#15181c; --plate-d:#4fb36d; --on-d:#0d1117; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101215; --surface:#181b1f; --ink:#eceef1; --muted:#98a1ab; --line:#2a2f35; --soft:#22262b;
  --plate-a:#e3533e; --on-a:#ffffff; --plate-b:#4a8bf0; --on-b:#0d1117;
  --plate-c:#f0c42e; --on-c:#15181c; --plate-d:#4fb36d; --on-d:#0d1117; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 48px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.top::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:env(safe-area-inset-top,0px);background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:34px;height:34px;border-radius:8px;flex:none}
.brand .txt{flex:1;min-width:0}
.bname{font:800 22px/1 var(--display);letter-spacing:.02em;text-transform:uppercase}
.meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:38px;padding:0 12px;font-size:14px;font-weight:600}

.weeks,.days{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.weeks::-webkit-scrollbar,.days::-webkit-scrollbar{display:none}
.chip{flex:1 0 auto;min-width:46px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 8px 7px;display:flex;flex-direction:column;align-items:center;gap:4px}
.chip .l{font:700 17px/1 var(--display);letter-spacing:.03em;text-transform:uppercase}
.chip .s{font-size:11px;line-height:1;color:var(--muted);font-variant-numeric:tabular-nums}
.chip .bar{width:100%;height:3px;border-radius:2px;background:var(--soft);overflow:hidden}
.chip .bar i{display:block;height:100%;background:var(--muted)}
.weeks .chip{flex:1 1 0;min-width:0;padding-inline:2px}
.days .chip{flex:1 1 0}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.on .s{color:var(--bg);opacity:.75}
.chip.on .bar{background:color-mix(in srgb,var(--bg) 25%,transparent)}
.chip.on .bar i{background:var(--bg)}
.chip.done:not(.on) .bar i{background:var(--plate-d)}
.day-chip .plate{width:10px;height:10px;border-radius:50%;background:var(--pc)}
.day-chip.on{background:var(--pc);border-color:var(--pc);color:var(--onpc)}
.day-chip.on .s{color:var(--onpc)}
.day-chip.on .plate{background:var(--onpc)}
.day-chip.on .bar{background:color-mix(in srgb,var(--onpc) 25%,transparent)}
.day-chip.on .bar i{background:var(--onpc)}
.day-chip .row{display:flex;align-items:center;gap:5px}

.dayhead{padding-block:22px 6px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.dayhead h1{margin:4px 0 0;font:800 40px/1 var(--display);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dayhead h1 .tag{width:40px;height:40px;border-radius:50%;align-self:center;flex:none;background:radial-gradient(circle,var(--bg) 0 5px,var(--soft) 6px 11px,var(--day) 12px);box-shadow:inset 0 0 0 4px color-mix(in srgb,var(--ink) 14%,transparent)}
.dayhead h1 .sub{font-weight:700;font-size:26px;color:var(--muted)}
.prog{display:flex;align-items:center;gap:12px;margin-top:14px}
.seg{flex:1;display:flex;gap:3px}
.seg i{flex:1;height:6px;border-radius:3px;background:var(--soft)}
.seg i.f{background:var(--day)}
.count{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}

.note{margin-top:14px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--plate-d) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--plate-d) 40%,var(--line));font-size:14px}
.note b{font-weight:600}

.slots{list-style:none;margin:14px 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.slot{padding:14px 14px 16px;display:grid;gap:8px}
.slot+.slot{border-top:1px solid var(--line)}
.slot-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.mg{margin:0;font:700 21px/1.05 var(--display);text-transform:uppercase;letter-spacing:.02em;min-width:0}
.mg .tick{display:inline-block;width:16px;height:16px;margin-left:6px;vertical-align:-1px;color:var(--plate-d)}
.scheme{font-size:15px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.scheme b{color:var(--ink);font-weight:600}
.sets{display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.set{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;font:700 19px/1 var(--display);color:var(--muted);transition:background .12s,border-color .12s,transform .08s}
.set:active{transform:scale(.93)}
.set.on{background:var(--day);border-color:var(--day);color:var(--on-day)}
.set svg{width:20px;height:20px}
.slot.complete .mg{color:var(--muted)}

.foot{margin-top:18px;display:grid;gap:10px}
.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:600;font-size:16px;background:var(--ink);color:var(--bg);width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.go{background:var(--day);color:var(--on-day)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
.panel h3{margin:0;font:800 22px/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.panel p{margin:0;font-size:14px;color:var(--muted)}
.row2{display:flex;gap:8px}
.row2 .btn{flex:1}

#settings{margin-top:22px;display:grid;gap:14px}
#settings[hidden]{display:none!important}
.hist{list-style:none;margin:0;padding:0;font-size:14px;font-variant-numeric:tabular-nums}
.hist li{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)}
.hist li:first-child{border-top:0}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px;font:12px/1.4 ui-monospace,Menlo,monospace}
.msg{font-size:13px;color:var(--plate-d);min-height:1em}
@media (prefers-reduced-motion:reduce){.set{transition:none}}
</style>

</head>

<script>
(function(){
const KEY='blanko-split-v2';
const DAY_TYPES={
  A:{name:'Push + Core',plate:'a',slots:[
    {id:'a1',mg:'Brust – Compound',sets:3,reps:'6–10'},
    {id:'a2',mg:'Brust – Isolation',sets:2,reps:'10–15'},
    {id:'a3',mg:'Trizeps – Overhead / gedehnt',sets:3,reps:'8–12'},
    {id:'a4',mg:'Trizeps – frei',sets:2,reps:'10–15'},
    {id:'a5',mg:'Hintere Schulter',sets:3,reps:'12–20'},
    {id:'a6',mg:'Core – Flexion',sets:3,reps:'10–15'}]},
  B:{name:'Pull + Core',plate:'b',slots:[
    {id:'b1',mg:'Rücken – horizontaler Zug',sets:3,reps:'6–10'},
    {id:'b2',mg:'Rücken – vertikaler Zug',sets:3,reps:'8–12'},
    {id:'b3',mg:'Bizeps – gedehnt',sets:3,reps:'8–12'},
    {id:'b4',mg:'Bizeps – frei',sets:2,reps:'10–15'},
    {id:'b5',mg:'Seitliche Schulter',sets:3,reps:'12–20'},
    {id:'b6',mg:'Core – Anti-Rotation',sets:2,reps:'10–15',side:true}]},
  C:{name:'Beine + Arme',plate:'c',slots:[
    {id:'c1',mg:'Beine – Compound (Quad)',sets:3,reps:'8–12'},
    {id:'c2',mg:'Quadrizeps – Isolation',sets:2,reps:'12–20'},
    {id:'c3',mg:'Hamstrings – Kniebeugung',sets:3,reps:'10–15'},
    {id:'c4',mg:'Hüftabduktoren',sets:2,reps:'12–20'},
    {id:'c5',mg:'Hüftadduktoren',sets:2,reps:'12–20'},
    {id:'c6',mg:'Waden – Soleus',sets:3,reps:'10–15'},
    {id:'c7',mg:'Bizeps – frei',sets:3,reps:'8–12'},
    {id:'c8',mg:'Trizeps – Overhead / gedehnt',sets:3,reps:'10–15'},
    {id:'c9',mg:'Vordere Schulter',sets:3,reps:'10–15'}]}
};
const DAYS=[{id:'OK1',type:'A'},{id:'UK',type:'C'},{id:'OK2',type:'B'}];
const DL=9; // Runde 1–8, dann Deload
const WEEKS=[1,2,3,4,5,6,7,8,9];
const wLabel=w=>w===DL?'DL':String(w);
const wLong=w=>w===DL?'Deload':'Runde '+w;
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

const today=()=>new Date().toISOString().slice(0,10);
const fmt=iso=>{if(!iso)return '';const [y,m,d]=iso.split('-');return d+'.'+m+'.'+y};
const fresh=()=>({v:2,block:1,blocks:{1:{start:today(),end:null,checks:{}}},last:null});

let S;
function load(){try{const r=localStorage.getItem(KEY);S=r?JSON.parse(r):fresh()}catch(e){S=fresh()}
  if(!S||!S.blocks||!S.blocks[S.block])S=fresh();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const B=()=>S.blocks[S.block];
const setsFor=(slot,w)=>w===DL?Math.ceil(slot.sets/2):slot.sets;
const ck=(w,d,s)=>w+'|'+d+'|'+s;
function getChecks(b,w,d,slot){const a=(S.blocks[b].checks[ck(w,d,slot.id)])||[];const n=setsFor(slot,w);const o=[];for(let i=0;i<n;i++)o.push(!!a[i]);return o}
function dayProg(b,w,d){const t=DAY_TYPES[DAYS.find(x=>x.id===d).type];let done=0,tot=0;
  t.slots.forEach(s=>{const c=getChecks(b,w,d,s);tot+=c.length;done+=c.filter(Boolean).length});return{done,tot}}
function weekProg(b,w){let done=0,tot=0;DAYS.forEach(d=>{const p=dayProg(b,w,d.id);done+=p.done;tot+=p.tot});return{done,tot}}
function blockProg(b){let done=0,tot=0;WEEKS.forEach(w=>{const p=weekProg(b,w);done+=p.done;tot+=p.tot});return{done,tot}}
const pct=p=>p.tot?Math.round(p.done/p.tot*100):0;

let view={w:1,d:DAYS[0].id};
let confirmFinish=false;
const $=id=>document.getElementById(id);

function renderHeader(){
  const b=B();
  $('blockMeta').textContent='Block '+S.block+' · seit '+fmt(b.start)+' · '+pct(blockProg(S.block))+' %';
  $('weeks').innerHTML=WEEKS.map(w=>{const p=weekProg(S.block,w);const on=w===view.w;
    return '<button class="chip'+(on?' on':'')+(p.tot&&p.done===p.tot?' done':'')+'" data-w="'+w+'" aria-pressed="'+on+'"><span class="l">'+wLabel(w)+'</span><span class="bar"><i style="width:'+pct(p)+'%"></i></span></button>'}).join('');
  $('days').innerHTML=DAYS.map(d=>{const t=DAY_TYPES[d.type];const p=dayProg(S.block,view.w,d.id);const on=d.id===view.d;
    return '<button class="chip day-chip'+(on?' on':'')+(p.tot&&p.done===p.tot?' done':'')+'" style="--pc:var(--plate-'+t.plate+');--onpc:var(--on-'+t.plate+')" data-d="'+d.id+'" aria-pressed="'+on+'"><span class="row"><span class="plate"></span><span class="l">'+d.id+'</span></span><span class="s">'+p.done+'/'+p.tot+'</span></button>'}).join('');
  const aw=$('weeks').querySelector('.on'),ad=$('days').querySelector('.on');
  [aw,ad].forEach(el=>{if(el&&el.scrollIntoView)try{el.scrollIntoView({block:'nearest',inline:'nearest'})}catch(e){}});
}

function nextDay(){const i=DAYS.findIndex(d=>d.id===view.d);
  if(i<DAYS.length-1)return{w:view.w,d:DAYS[i+1].id};
  if(view.w<DL)return{w:view.w+1,d:DAYS[0].id};return null}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function renderDay(){
  const d=DAYS.find(x=>x.id===view.d),t=DAY_TYPES[d.type];
  const main=$('day');
  main.style.setProperty('--day','var(--plate-'+t.plate+')');
  main.style.setProperty('--on-day','var(--on-'+t.plate+')');
  const p=dayProg(S.block,view.w,d.id);
  let segs='';t.slots.forEach(s=>{getChecks(S.block,view.w,d.id,s).forEach(v=>{segs+='<i'+(v?' class="f"':'')+'></i>'})});
  let h='<section class="dayhead"><div class="eyebrow">Block '+S.block+' · '+wLong(view.w)+'</div>'+
    '<h1><span class="tag" aria-hidden="true"></span>'+d.id+' <span class="sub">'+t.name+'</span></h1>'+
    '<div class="prog"><div class="seg" aria-hidden="true">'+segs+'</div><div class="count">'+p.done+' / '+p.tot+' Sätze</div></div>';
  if(view.w===DL)h+='<div class="note"><b>Deload:</b> Sätze halbiert, Wiederholungsbereich bleibt, Last etwa 10–20 % runter.</div>';
  h+='</section><ol class="slots">';
  t.slots.forEach(s=>{const c=getChecks(S.block,view.w,d.id,s);const all=c.every(Boolean);
    h+='<li class="slot'+(all?' complete':'')+'"><div class="slot-top"><h2 class="mg">'+s.mg+(all?'<span class="tick">'+CHECK+'</span>':'')+'</h2>'+
      '<div class="scheme"><b>'+c.length+'</b> × '+s.reps+(s.side?' / Seite':'')+'</div></div>'+
      '<div class="sets">'+c.map((v,i)=>'<button class="set'+(v?' on':'')+'" data-s="'+s.id+'" data-i="'+i+'" aria-pressed="'+v+'" aria-label="Satz '+(i+1)+(v?' erledigt':'')+'">'+(v?CHECK:(i+1))+'</button>').join('')+'</div></li>'});
  h+='</ol><div class="foot">';
  const nd=nextDay();
  if(p.tot&&p.done===p.tot&&nd){const n=DAYS.find(x=>x.id===nd.d);
    h+='<button class="btn go" id="nextBtn">Weiter: '+(nd.w!==view.w?wLong(nd.w)+' · ':'')+n.id+' →</button>'}
  if(view.w===DL)h+=finishPanel();
  h+='</div>';
  main.innerHTML=h;
}

function finishPanel(){
  if(!confirmFinish)return '<div class="panel"><h3>Block '+S.block+' abschließen</h3><p>Nach dem Deload startet Block '+(S.block+1)+' wieder bei Runde 1.</p><button class="btn" data-act="finish">Block abschließen</button></div>';
  return '<div class="panel"><h3>Sicher?</h3><p>Block '+S.block+' wird archiviert ('+pct(blockProg(S.block))+' % erledigt). Danach geht es mit Block '+(S.block+1)+', Runde 1 weiter.</p><div class="row2"><button class="btn ghost" data-act="cancel">Abbrechen</button><button class="btn" data-act="confirm">Block '+(S.block+1)+' starten</button></div></div>';
}

function renderSettings(){
  const ids=Object.keys(S.blocks).map(Number).sort((a,b)=>b-a);
  $('hist').innerHTML=ids.map(i=>{const b=S.blocks[i];return '<li><span>Block '+i+' · '+fmt(b.start)+(b.end?' – '+fmt(b.end):' – laufend')+'</span><span>'+pct(blockProg(i))+' %</span></li>'}).join('');
  $('earlyFinish').innerHTML=view.w===DL?'':finishPanel();
}

function render(){renderHeader();renderDay();if(!$('settings').hidden)renderSettings()}

function finishBlock(){
  const old=B();old.end=today();
  const n=S.block+1;
  S.blocks[n]={start:today(),end:null,checks:{}};
  S.block=n;S.last=null;view={w:1,d:DAYS[0].id};confirmFinish=false;save();render();
  try{window.scrollTo({top:0})}catch(e){}
}

document.addEventListener('click',e=>{
  const el=e.target.closest('button');if(!el)return;
  if(el.dataset.w){view.w=+el.dataset.w;confirmFinish=false;render();return}
  if(el.dataset.d){view.d=el.dataset.d;render();try{window.scrollTo({top:0})}catch(_){};return}
  if(el.classList.contains('set')){
    const d=DAYS.find(x=>x.id===view.d),slot=DAY_TYPES[d.type].slots.find(s=>s.id===el.dataset.s);
    const c=getChecks(S.block,view.w,view.d,slot);const i=+el.dataset.i;c[i]=!c[i];
    B().checks[ck(view.w,view.d,slot.id)]=c;
    if(c[i])S.last={b:S.block,w:view.w,d:view.d};
    save();const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(el.id==='nextBtn'){const nd=nextDay();if(nd){view=nd;render();try{window.scrollTo({top:0})}catch(_){}}return}
  const act=el.dataset.act;
  if(act==='finish'){confirmFinish=true;render();return}
  if(act==='cancel'){confirmFinish=false;render();return}
  if(act==='confirm'){finishBlock();return}
  if(el.id==='menuBtn'){const s=$('settings');s.hidden=!s.hidden;el.setAttribute('aria-expanded',String(!s.hidden));if(!s.hidden){renderSettings();s.scrollIntoView({behavior:'smooth',block:'start'})}return}
  if(el.id==='copyBtn'){const txt=JSON.stringify(S);const ta=$('backupTxt');ta.value=txt;
    const ok=()=>{$('backupMsg').textContent='Backup kopiert.'};
    const fb=()=>{ta.focus();ta.select();$('backupMsg').textContent='Text markiert – bitte manuell kopieren.'};
    try{navigator.clipboard.writeText(txt).then(ok,fb)}catch(_){fb()}return}
  if(el.id==='importBtn'){try{const o=JSON.parse($('backupTxt').value);if(!o||!o.blocks||!o.blocks[o.block])throw 0;S=o;save();pickView();render();$('backupMsg').textContent='Backup eingespielt.'}catch(_){$('backupMsg').textContent='Das ist kein gültiges Backup. Bitte den kompletten kopierten Text einfügen.'}return}
});

function pickView(){
  if(S.last&&S.last.b===S.block&&DAYS.some(d=>d.id===S.last.d))view={w:S.last.w,d:S.last.d};else view={w:1,d:DAYS[0].id};
}
load();pickView();render();
})();
</script>

</body>
</html>
